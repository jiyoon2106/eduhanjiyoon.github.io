<!-- AI 생성 초안: 검수 전 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ThRead 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #ffffff;
    }
    /* Navbar 스타일 */
    .navbar-custom {
      background-color: #f8f9fa;
      border-bottom: 1px solid #e5e5e5;
    }
    .navbar-brand {
      font-weight: 800;
      font-size: 28px;
      color: #1a1a1a;
    }
    .nav-link {
      color: #6c757d;
      font-size: 14px;
      padding-left: 14px;
      padding-right: 14px;
    }
    /* 로그인 카드 스타일 */
    .login-card {
      width: 420px;
      max-width: 90vw;
      border-radius: 6px;
      background-color: #fff;
      border: 1px solid #e9ecef;
    }
    .form-label {
      font-weight: 600;
    }
    .btn-login {
      background-color: #1dc446;
      border-color: #1dc446;
      color: #fff;
      font-weight: 600;
    }
    @media (max-width: 768px) {
      .login-card {
        width: 90vw;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">ThRead</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navItems" aria-controls="navItems" aria-expanded="false" aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navItems">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item">
            <a class="nav-link" href="#">쓰레드</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">도서 검색</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">마이 페이지</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">로그아웃</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- 로그인 영역 -->
  <main class="d-flex flex-column justify-content-center min-vh-100">
    <div class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 64px);">
      <div class="card login-card shadow-sm border-0">
        <div class="card-body p-4">
          <form>
            <div class="mb-3">
              <label for="inputEmail" class="form-label">이메일</label>
              <input type="email" class="form-control" id="inputEmail" placeholder="name@example.com" />
            </div>
            <div class="mb-3">
              <label for="inputPassword" class="form-label">비밀번호</label>
              <input type="password" class="form-control" id="inputPassword" placeholder="비밀번호를 입력하세요" />
            </div>
            <hr class="my-2" />
            <button type="submit" class="btn btn-login w-100 py-2">로그인</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
